name: Build See-through Worker

on:
  push:
    branches:
      - inho/live2d-see-through
    paths:
      - 'backend/ai-worker/**'
      - '.github/workflows/build-see-through.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-see-through" >> "$GITHUB_OUTPUT"

      - name: Build and publish See-through worker
        uses: docker/build-push-action@v6
        with:
          context: ./backend/ai-worker
          file: ./backend/ai-worker/runpod-see-through/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
